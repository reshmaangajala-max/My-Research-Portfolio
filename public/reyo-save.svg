<?xml version="1.0" encoding="UTF-8"?>
<svg width="1560" height="960" viewBox="0 0 1560 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saveOuterBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08070e"/>
      <stop offset="100%" stop-color="#050409"/>
    </linearGradient>

    <linearGradient id="modalCardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18132b"/>
      <stop offset="100%" stop-color="#120e22"/>
    </linearGradient>

    <linearGradient id="checkCircleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="modalBtnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6328e0"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#6d28d9" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Canvas Base -->
  <rect width="1560" height="960" fill="url(#saveOuterBg)"/>

  <!-- Dimmed YouTube Container Frame in Background -->
  <g opacity="0.38">
    <!-- YouTube Top Bar -->
    <g transform="translate(36, 24)">
      <rect x="0" y="4" width="30" height="20" rx="5" fill="#ff0000"/>
      <polygon points="12,8 20,14 12,20" fill="#ffffff"/>
      <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#ffffff">YouTube</text>
      <rect x="390" y="-2" width="520" height="40" rx="20" fill="#141418" stroke="#2c2c36" stroke-width="1"/>
      <text x="410" y="24" font-size="14" fill="#71717a">Search</text>
    </g>

    <!-- Dimmed Video Frame -->
    <g transform="translate(36, 88)">
      <rect width="1020" height="574" rx="16" fill="#0d091e"/>
      <rect x="36" y="36" width="150" height="26" rx="13" fill="#241544"/>
      <text x="111" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#c084fc">UI/UX Case Study</text>
      <text x="36" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="800" fill="#ffffff">Designing a KYC</text>
      <text x="36" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="800" fill="#ffffff">Onboarding Flow</text>

      <rect x="24" y="520" width="972" height="4" fill="#33333a"/>
      <rect x="24" y="520" width="300" height="4" fill="#ef4444"/>

      <!-- Dimmed Video Meta -->
      <g transform="translate(0, 595)">
        <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
          Designing a KYC Onboarding Flow — Full UX Case Study
        </text>
      </g>
    </g>

    <!-- Dimmed Right Sidebar -->
    <g transform="translate(1085, 88)">
      <rect width="168" height="96" rx="10" fill="#18132c"/>
      <rect y="108" width="168" height="96" rx="10" fill="#18132c"/>
      <rect y="216" width="168" height="96" rx="10" fill="#18132c"/>
      <rect y="324" width="168" height="96" rx="10" fill="#18132c"/>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- ACTIVE BOTTOM BUTTON: ✨ Saved to Reyo -->
  <!-- ========================================================= -->
  <g transform="translate(750, 726)">
    <rect width="170" height="40" rx="20" fill="#201140" stroke="#7c3aed" stroke-width="1.8"/>
    <g transform="translate(20, 11)">
      <path d="M7 2 L8.5 6 L12.5 7.5 L8.5 9 L7 13 L5.5 9 L1.5 7.5 L5.5 6 Z" fill="#c084fc"/>
      <circle cx="12" cy="3" r="1" fill="#c084fc"/>
    </g>
    <text x="44" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Saved to Reyo</text>
  </g>

  <!-- ========================================================= -->
  <!-- CENTER MODAL DIALOG: "Saved to Reyo" -->
  <!-- ========================================================= -->
  <g transform="translate(520, 240)" filter="url(#modalShadow)">
    <!-- Dialog Background Box -->
    <rect width="520" height="410" rx="24" fill="url(#modalCardBg)" stroke="#372466" stroke-width="1.8"/>

    <!-- Top Gradient Checkmark Circle -->
    <g transform="translate(260, 76)">
      <circle cx="0" cy="0" r="34" fill="url(#checkCircleGrad)"/>
      <!-- Checkmark (✓) -->
      <path d="M-11 1 L-3 9 L11 -7" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Headline: Saved to Reyo -->
    <text x="260" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Saved to Reyo
    </text>

    <!-- Subheading description -->
    <text x="260" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15.5" fill="#cbd5e1" font-weight="400">
      We'll organize and make it easy to find later.
    </text>

    <!-- Primary Action Button: [ View in Reyo ] -->
    <g transform="translate(48, 246)">
      <rect width="424" height="56" rx="14" fill="url(#modalBtnGrad)"/>
      <text x="212" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">
        View in Reyo
      </text>
    </g>

    <!-- Secondary Link: Continue browsing -->
    <text x="260" y="348" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" cursor="pointer">
      Continue browsing
    </text>
  </g>
</svg>